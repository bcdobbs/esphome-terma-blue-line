# terma.package.yaml — the shared "Terma Blue Line" configuration.
# Consumed via packages: git for users, include via !include for local dev. Holds every
# entity, script, global, the ble_client, the BLE stack, and the terma_moa
# component. References substitutions only — secrets and board belong elsewhere.
#
# Substitution contract (provided by the consuming device file):
#   radiator_mac  (required)  the radiator's BLE MAC (from secrets.yaml)
#   protocol      (optional)  "modern" (default) or "legacy" — which generation of the
#                             Terma BLE protocol the radiator speaks. See README
#                             "Protocol versions".
substitutions:
  protocol: modern

# Enable BLE with keyboard capability for PIN entry
esp32_ble:
  io_capability: keyboard_only

# Enable the Bluetooth tracker
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 30ms

# Persistent connections to the radiator need encryption - otherwise it can only be
# controlled while it's held in pairing mode. On the first boot the radiator must be in
# pairing mode so the ESP can bond; afterwards it reconnects without it.
ble_client:
  - mac_address: ${radiator_mac}
    id: terma_moa_ble_client
    auto_connect: true
    on_connect:
      then:
        # The terma_moa component has already requested encryption. The link isn't
        # usable until that finishes - terma_moa's on_ready fires then.
        - logger.log: "BLE client connected - waiting for encryption"
    on_passkey_request:
      then:
        # The PIN is fixed by the radiator (Terma Blue Line default), not configurable.
        - logger.log: "Passkey requested by radiator - sending 123456"
        - ble_client.passkey_reply:
            id: terma_moa_ble_client
            passkey: 123456
    on_passkey_notification:
      then:
        - logger.log:
            format: "Passkey notification received: %d"
            args: ["(int) passkey"]
    on_disconnect:
      then:
        - logger.log: "BLE client disconnected!"
        - component.update: radiator_status

# Terma MOA Blue helper component - requests link encryption on connect so the radiator
# will serve its (encrypted) characteristics, and reports when the link is ready.
terma_moa:
  id: terma_hub
  ble_client_id: terma_moa_ble_client
  protocol: ${protocol}
  on_ready:
    then:
      - logger.log: "BLE connection ready"
      - component.update: radiator_status
      # Read everything straight away rather than waiting for the next poll.
      - component.update: mode_raw
      - component.update: room_temp_raw
      - component.update: heater_temp_raw

# Globals to store state. Nothing is restored across reboots: the radiator is the
# source of truth and is read as soon as the link is ready.
globals:
  - id: power_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: operating_mode
    type: int
    restore_value: no
    initial_value: "0"
  # Timer detection: b6 counts down while a timer runs and freezes when it stops,
  # so we infer "timer active" by watching the remaining value change between reads.
  - id: timer_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: timer_prev_remaining
    type: int
    restore_value: no
    initial_value: "-1"
  - id: timer_stale
    type: int
    restore_value: no
    initial_value: "0"

# ============================================
# Polling
# ============================================
# The BLE sensors below have update_interval: never and are read from here, only while
# the link is ready, so a disconnected ESP doesn't spam "Cannot poll" warnings.
interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready();"
          then:
            - component.update: mode_raw
            - component.update: room_temp_raw
            - component.update: heater_temp_raw
  # The b6 countdown only matters while a modern radiator is heating (legacy units
  # have no timer), so skip the read the rest of the time.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              return id(terma_hub).is_ready() && id(terma_hub).supports_timer() &&
                     id(power_state);
          then:
            - component.update: timer_remaining

# ============================================
# BLE Sensors from Radiator
# ============================================
# Raw payloads are logged at VERBOSE. Set `logger: level: VERBOSE` to see them.
sensor:
  # Room temperature (b1) - the radiator's built-in sensor, which sits in the
  # controller and reads high. See README "Room temperature" for calibration.
  - platform: ble_client
    type: characteristic
    ble_client_id: terma_moa_ble_client
    id: room_temp_raw
    name: "Radiator Room Sensor"
    internal: false
    service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
    characteristic_uuid: "d97352b1-d19e-11e2-9e96-0800200c9a66"
    update_interval: never
    notify: false
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    icon: "mdi:thermometer"
    lambda: |-
      ESP_LOGV("terma", "b1 room raw (%d bytes): %s", (int) x.size(), format_hex_pretty(x).c_str());
      if (x.size() >= 4) {
        // uint16 in the configured byte order, value / 10 = °C.
        float current_room = id(terma_hub).decode_u16(x, 0) / 10.0f;
        float target_room = id(terma_hub).decode_u16(x, 2) / 10.0f;
        ESP_LOGD("terma", "Room - Current: %.1f°C, Target: %.1f°C", current_room, target_room);
        // Reflect the radiator's room target into the Room Target number, but only
        // while heating - when off, leave the number showing the user's pre-set value
        // (applied on the next turn-on) instead of overwriting it with a read.
        // publish_state doesn't trigger set_action, so no loop.
        if (id(power_state) && target_room >= 15.0f && target_room <= 30.0f &&
            id(room_target).state != target_room) {
          id(room_target).publish_state(target_room);
        }
        // Legacy safety net: these units can end up with a doubled target when switched
        // between room and element mode. If room mode reports a target above the
        // radiator's 30 C maximum, switch it off.
        if (id(terma_hub).is_legacy() && id(terma_hub).is_room_mode(id(operating_mode)) &&
            target_room > 30.0f) {
          ESP_LOGE("terma", "Room target %.1f C is out of range - switching radiator off", target_room);
          id(legacy_safety_off).execute();
        }
        return current_room;
      }
      return NAN;

  # Element temperature (b2)
  - platform: ble_client
    type: characteristic
    ble_client_id: terma_moa_ble_client
    id: heater_temp_raw
    name: "Radiator Element Temperature"
    internal: false
    service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
    characteristic_uuid: "d97352b2-d19e-11e2-9e96-0800200c9a66"
    update_interval: never
    notify: false
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    icon: "mdi:radiator"
    lambda: |-
      ESP_LOGV("terma", "b2 element raw (%d bytes): %s", (int) x.size(), format_hex_pretty(x).c_str());
      if (x.size() >= 4) {
        // uint16 in the configured byte order, value / 10 = °C.
        id(terma_hub).check_element_payload(x);
        float current_heater = id(terma_hub).decode_u16(x, 0) / 10.0f;
        float target_heater = id(terma_hub).decode_u16(x, 2) / 10.0f;
        ESP_LOGD("terma", "Heater - Current: %.1f°C, Target: %.1f°C", current_heater, target_heater);
        // Reflect the radiator's element target into the Element Target number, but
        // only while heating - when off, leave the number showing the user's pre-set
        // value (applied on the next turn-on) instead of overwriting it with a read.
        // publish_state only updates the shown value - it does NOT trigger set_action.
        if (id(power_state) && target_heater >= 30.0f && target_heater <= 60.0f &&
            id(rail_target).state != target_heater) {
          id(rail_target).publish_state(target_heater);
        }
        // Legacy safety net (see the room sensor): element mode above 60 C -> off.
        if (id(terma_hub).is_legacy() && id(terma_hub).is_element_mode(id(operating_mode)) &&
            target_heater > 60.0f) {
          ESP_LOGE("terma", "Element target %.1f C is out of range - switching radiator off", target_heater);
          id(legacy_safety_off).execute();
        }
        return current_heater;
      }
      return NAN;

  # Operating mode (b3): 4 bytes on modern units, 1 byte on legacy ones; byte 0 is
  # the mode. Decoding depends on the protocol generation (see terma_moa).
  - platform: ble_client
    type: characteristic
    ble_client_id: terma_moa_ble_client
    id: mode_raw
    name: "Operating Mode Raw"
    internal: true
    service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
    characteristic_uuid: "d97352b3-d19e-11e2-9e96-0800200c9a66"
    update_interval: never
    notify: false
    lambda: |-
      ESP_LOGV("terma", "b3 mode raw (%d bytes): %s", (int) x.size(), format_hex_pretty(x).c_str());
      id(terma_hub).check_mode_payload(x);
      if (x.size() >= 1) {
        int mode = x[0];
        bool heating = id(terma_hub).is_heating(mode);
        id(set_state).execute(heating, mode);
        // Reflect the device's regulation mode in the Heat Mode select. publish_state
        // updates the shown value only - it does not trigger the select's set_action,
        // so there's no write-back loop.
        if (id(terma_hub).is_room_mode(mode) && id(heat_mode).current_option() != "Room") {
          id(heat_mode).publish_state("Room");
        } else if (id(terma_hub).is_element_mode(mode) && id(heat_mode).current_option() != "Element") {
          id(heat_mode).publish_state("Element");
        }
        ESP_LOGD("terma", "Operating mode: 0x%02X (%d) heating=%d", mode, mode, heating);
        return (float) mode;
      }
      return NAN;

  # Timer countdown (b6). Bytes 0-1 = remaining seconds, bytes 2-3 = total duration.
  # Only read while a modern radiator is heating (see interval: above); shows 0 once
  # the radiator turns off.
  - platform: ble_client
    type: characteristic
    ble_client_id: terma_moa_ble_client
    id: timer_remaining
    name: "Timer Remaining"
    internal: false
    service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
    characteristic_uuid: "d97352b6-d19e-11e2-9e96-0800200c9a66"
    update_interval: never
    notify: false
    unit_of_measurement: "min"
    accuracy_decimals: 0
    icon: "mdi:timer-sand"
    lambda: |-
      if (x.size() >= 4) {
        int remaining_s = id(terma_hub).decode_u16(x, 0);
        int total_s = id(terma_hub).decode_u16(x, 2);
        // A running timer counts down; a stopped one leaves b6 frozen. Infer
        // "active" from whether the remaining value changes between reads.
        int prev = id(timer_prev_remaining);
        if (prev >= 0) {
          if (remaining_s != prev) {
            id(timer_active) = true;  // changed = counting down (or a new timer set)
            id(timer_stale) = 0;
          } else {
            id(timer_stale) += 1;
            if (id(timer_stale) >= 3) id(timer_active) = false;  // frozen ~30s = no timer
          }
        }
        id(timer_prev_remaining) = remaining_s;
        ESP_LOGD("terma", "Timer: %d s remaining / %d s total (active=%d)",
                 remaining_s, total_s, id(timer_active));
        return remaining_s / 60.0f;
      }
      return NAN;

# Binary Sensors
binary_sensor:
  - platform: template
    name: "Radiator BLE Connected"
    id: ble_connected_sensor
    entity_category: diagnostic
    lambda: |-
      return id(terma_hub).is_ready();

  - platform: template
    name: "Heating Active"
    id: heating_active
    lambda: |-
      return id(power_state);
    device_class: heat

  # Plain state: is an auto-off timer running? Timer modes are reported directly by the
  # mode byte (room 0x03 / element 0x05 / physical 0x09), with the b6 countdown
  # (timer_active) as a fallback. A timer can't run while the radiator is off. Compose
  # any policy (e.g. "heating with no timer for 2h -> notify") in a Home Assistant
  # automation using this + Heating Active. Always off on legacy units (no timer).
  - platform: template
    name: "Timer Active"
    device_class: running
    lambda: |-
      return id(terma_hub).supports_timer() && id(power_state) &&
             (id(timer_active) || id(terma_hub).is_timer_mode(id(operating_mode)));

# ============================================
# Heat mode + target temperatures
# ============================================
# Element = the radiator holds the heating element at the target (30-60C, written
# to b2). Room = it holds the room air at the target (15-30C, using the radiator's
# built-in sensor, written to b1). Heat Mode selects which is used by the Radiator
# Power switch and the Start Timer button.
select:
  - platform: template
    name: "Heat Mode"
    id: heat_mode
    icon: "mdi:radiator"
    options:
      - "Element"
      - "Room"
    initial_option: "Element"
    restore_value: true
    optimistic: true
    set_action:
      # Changing Heat Mode while the radiator is ON switches it live. Modern: write the
      # target to the new mode's characteristic, then its manual mode byte. Legacy: go
      # via off first (see legacy_apply). x = the newly selected option. When off this
      # is a no-op and the choice just applies on the next Radiator Power / Start Timer.
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready() && id(power_state);"
          then:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_legacy();"
                then:
                  # Legacy: off -> target -> mode, never a direct room<->element switch.
                  - script.execute:
                      id: legacy_apply
                      m: !lambda 'return id(terma_hub).mode_manual(x == "Room");'
                      t: !lambda 'return x == "Room" ? id(room_target).state : id(rail_target).state;'
                else:
                  - script.execute:
                      id: modern_switch_mode
                      room: !lambda 'return x == "Room";'

number:
  # Element target (30-60C) - used when Heat Mode = Element.
  - platform: template
    name: "Element Target Temperature"
    id: rail_target
    icon: "mdi:radiator"
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 60
    # 5 discrete levels matching the radiator's physical buttons: 30 / 37.5 / 45 / 52.5 / 60
    step: 7.5
    initial_value: 45
    restore_value: true
    optimistic: true
    set_action:
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready() && id(power_state);"
          then:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_legacy();"
                then:
                  # Legacy: re-apply via off -> target -> mode, only if in element mode.
                  - if:
                      condition:
                        lambda: "return id(terma_hub).is_element_mode(id(operating_mode));"
                      then:
                        - script.execute:
                            id: legacy_apply
                            m: !lambda "return id(operating_mode);"
                            t: !lambda "return x;"
                else:
                  # Use x (the just-set value): .state lags until after set_action runs.
                  - script.execute:
                      id: write_target
                      room: false
                      t: !lambda "return x;"

  # Room target (15-30C) - used when Heat Mode = Room.
  - platform: template
    name: "Room Target Temperature"
    id: room_target
    icon: "mdi:home-thermometer"
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 30
    step: 0.5
    initial_value: 21
    restore_value: true
    optimistic: true
    set_action:
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready() && id(power_state);"
          then:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_legacy();"
                then:
                  # Legacy: re-apply via off -> target -> mode, only if in room mode.
                  - if:
                      condition:
                        lambda: "return id(terma_hub).is_room_mode(id(operating_mode));"
                      then:
                        - script.execute:
                            id: legacy_apply
                            m: !lambda "return id(operating_mode);"
                            t: !lambda "return x;"
                else:
                  - script.execute:
                      id: write_target
                      room: true
                      t: !lambda "return x;"

  # How long the "Start Timer" button runs the bounded auto-off timer.
  - platform: template
    name: "Timer Duration"
    id: timer_minutes
    icon: "mdi:timer-cog-outline"
    unit_of_measurement: "min"
    min_value: 15
    max_value: 180
    step: 15
    initial_value: 60
    restore_value: true
    optimistic: true

# Scripts. BLE writes are asynchronous (each waits for the radiator's write response),
# so the scripts that write use mode: queued - a second call made while the first is
# in flight runs after it instead of being dropped.
script:
  # Record the radiator's state locally (power + mode byte) and refresh the status text
  # when it changes. Called after every read of b3 and optimistically after writes.
  - id: set_state
    parameters:
      heating: bool
      mode: int
    then:
      - lambda: |-
          bool changed = heating != id(power_state) || mode != id(operating_mode);
          id(power_state) = heating;
          id(operating_mode) = mode;
          if (!heating && id(timer_prev_remaining) >= 0) {
            // Off: no timer can be running. Reset detection and clear the countdown.
            id(timer_active) = false;
            id(timer_prev_remaining) = -1;
            id(timer_stale) = 0;
            id(timer_remaining).publish_state(0);
          }
          if (changed) id(radiator_status).update();

  # Write target temperature t to b1 (room) or b2 (element). The characteristic UUID
  # can't be templated, hence the branch. terma_moa clamps to the mode's range and
  # rounds to 0.1 C.
  - id: write_target
    mode: queued
    parameters:
      room: bool
      t: float
    then:
      - if:
          condition:
            lambda: "return room;"
          then:
            - ble_client.ble_write:
                id: terma_moa_ble_client
                service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
                characteristic_uuid: "d97352b1-d19e-11e2-9e96-0800200c9a66"
                value: !lambda "return id(terma_hub).encode_target(true, t);"
          else:
            - ble_client.ble_write:
                id: terma_moa_ble_client
                service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
                characteristic_uuid: "d97352b2-d19e-11e2-9e96-0800200c9a66"
                value: !lambda "return id(terma_hub).encode_target(false, t);"

  # Push the selected Heat Mode's target temperature to the radiator.
  - id: push_target
    then:
      - script.execute:
          id: write_target
          room: !lambda 'return id(heat_mode).current_option() == "Room";'
          t: !lambda |-
            return id(heat_mode).current_option() == "Room" ? id(room_target).state
                                                            : id(rail_target).state;

  # Write an operating-mode byte to b3 (1 byte on legacy units, 4 on modern).
  - id: set_mode
    mode: queued
    parameters:
      m: int
    then:
      - ble_client.ble_write:
          id: terma_moa_ble_client
          service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
          characteristic_uuid: "d97352b3-d19e-11e2-9e96-0800200c9a66"
          value: !lambda "return id(terma_hub).encode_mode(m);"

  # Modern: switch a running radiator between room and element regulation. This drops
  # it into manual (continuous) heating, so a running auto-off timer is cancelled.
  - id: modern_switch_mode
    mode: restart
    parameters:
      room: bool
    then:
      - if:
          condition:
            lambda: "return id(terma_hub).is_timer_mode(id(operating_mode));"
          then:
            - logger.log:
                level: WARN
                format: "Heat Mode changed while a timer was running - timer cancelled"
      - script.execute:
          id: set_state
          heating: true
          mode: !lambda "return id(terma_hub).mode_manual(room);"
      - script.execute:
          id: write_target
          room: !lambda "return room;"
          t: !lambda "return room ? id(room_target).state : id(rail_target).state;"
      - delay: 300ms
      - script.execute:
          id: set_mode
          m: !lambda "return id(terma_hub).mode_manual(room);"

  # Legacy: set mode m (5 room / 6 element) with target t, the safe way. Legacy units
  # can end up with a doubled target when switched directly between room and element
  # mode, so - like J1mbo's homebridge plugin - always go off -> target -> mode, then
  # read everything back. The room/element sensors switch the radiator off if the
  # read-back target is out of range.
  - id: legacy_apply
    mode: restart
    parameters:
      m: int
      t: float
    then:
      - script.execute:
          id: set_state
          heating: true
          mode: !lambda "return m;"
      - logger.log:
          format: "Legacy: off -> target %.1f C -> mode %d"
          args: ["t", "m"]
      - script.execute:
          id: set_mode
          m: 0
      - delay: 500ms
      - script.execute:
          id: write_target
          room: !lambda "return id(terma_hub).is_room_mode(m);"
          t: !lambda "return t;"
      - delay: 500ms
      - script.execute:
          id: set_mode
          m: !lambda "return m;"
      # Read back now rather than waiting for the next 30 s poll.
      - delay: 2s
      - component.update: mode_raw
      - component.update: room_temp_raw
      - component.update: heater_temp_raw

  # Legacy safety net: switch off immediately (called from the sensor lambdas).
  - id: legacy_safety_off
    then:
      - script.stop: legacy_apply
      - script.execute:
          id: set_state
          heating: false
          mode: 0
      - script.execute:
          id: set_mode
          m: 0

# Switches - radiator on/off in the selected Heat Mode
switch:
  - platform: template
    name: "Radiator Power"
    id: power_switch
    icon: "mdi:power"
    optimistic: false
    lambda: |-
      return id(power_state);
    turn_on_action:
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready();"
          then:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_legacy();"
                then:
                  - logger.log: "Radiator ON (legacy, per Heat Mode)"
                  - script.execute:
                      id: legacy_apply
                      m: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
                      t: !lambda 'return id(heat_mode).current_option() == "Room" ? id(room_target).state : id(rail_target).state;'
                else:
                  # Manual (continuous) heating in the selected mode. Mode byte: room 0x11 /
                  # element 0x21; target -> b1 (room) or b2 (element) via push_target.
                  - logger.log: "Radiator ON (manual, per Heat Mode)"
                  - script.execute:
                      id: set_state
                      heating: true
                      mode: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
                  - script.execute: push_target
                  - delay: 500ms
                  - script.execute:
                      id: set_mode
                      m: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
          else:
            - logger.log: "Not connected - cannot turn on"
    turn_off_action:
      - if:
          condition:
            lambda: "return id(terma_hub).is_ready();"
          then:
            - logger.log: "Radiator OFF"
            - script.stop: legacy_apply
            - script.stop: modern_switch_mode
            - script.execute:
                id: set_state
                heating: false
                mode: 0
            - script.execute:
                id: set_mode
                m: 0
          else:
            - logger.log: "Not connected - cannot turn off"

# Buttons
button:
  # Start a bounded auto-off timer, reproducing the write sequence the Terma app
  # sends (captured via BLE snoop): on (manual mode) -> countdown (b6=[secs,secs]) ->
  # target temp (b1/b2) -> run mode. The final run-mode write starts the countdown.
  # Mode bytes: room = 0x11 then 0x03, element = 0x21 then 0x05. Duration from
  # "Timer Duration"; temperature from the active mode's target number. Modern only.
  - platform: template
    name: "Start Timer"
    icon: "mdi:timer-play"
    on_press:
      - if:
          condition:
            lambda: "return !id(terma_hub).supports_timer();"
          then:
            - logger.log:
                level: WARN
                format: "Start Timer: not supported on legacy-protocol radiators"
          else:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_ready();"
                then:
                  - logger.log: "Start Timer: replaying app sequence (on -> duration -> temp -> run)"
                  # 1) turn on (manual): room 0x11 / element 0x21
                  - script.execute:
                      id: set_mode
                      m: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
                  - delay: 400ms
                  # 2) countdown: b6 = [remaining_s, total_s], both = duration
                  - ble_client.ble_write:
                      id: terma_moa_ble_client
                      service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
                      characteristic_uuid: "d97352b6-d19e-11e2-9e96-0800200c9a66"
                      value: !lambda |-
                        uint16_t s = (uint16_t) lroundf(id(timer_minutes).state * 60.0f);
                        return id(terma_hub).encode_u16_pair(s, s);
                  - delay: 400ms
                  # 3) target temp (b1 room / b2 element)
                  - script.execute: push_target
                  - delay: 400ms
                  # 4) run mode - this final write starts the countdown: room 0x03 / element 0x05
                  - script.execute:
                      id: set_mode
                      m: !lambda 'return id(terma_hub).mode_timer(id(heat_mode).current_option() == "Room");'
                  - script.execute:
                      id: set_state
                      heating: true
                      mode: !lambda 'return id(terma_hub).mode_timer(id(heat_mode).current_option() == "Room");'
                else:
                  - logger.log: "Start Timer: not connected"

  # Stop a running timer WITHOUT turning the radiator off: switch to manual
  # (continuous) heating in the current mode (room 0x11 / element 0x21). The radiator
  # keeps its target and just drops the auto-off countdown. Use Radiator Power to
  # actually turn it off. Modern only.
  - platform: template
    name: "Stop Timer"
    icon: "mdi:timer-off"
    on_press:
      - if:
          condition:
            lambda: "return !id(terma_hub).supports_timer();"
          then:
            - logger.log:
                level: WARN
                format: "Stop Timer: not supported on legacy-protocol radiators"
          else:
            - if:
                condition:
                  lambda: "return id(terma_hub).is_ready();"
                then:
                  - logger.log: "Stop Timer: switching to manual (continuous) in current mode"
                  - script.execute:
                      id: set_state
                      heating: true
                      mode: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
                  - script.execute: push_target
                  - delay: 300ms
                  - script.execute:
                      id: set_mode
                      m: !lambda 'return id(terma_hub).mode_manual(id(heat_mode).current_option() == "Room");'
                else:
                  - logger.log: "Stop Timer: not connected"

  - platform: template
    name: "Clear BLE Bonds"
    icon: "mdi:bluetooth-off"
    entity_category: diagnostic
    on_press:
      - logger.log: "Clearing BLE bond for the radiator..."
      # Removes the bond for this radiator (sufficient for a single-device setup).
      - ble_client.remove_bond:
          id: terma_moa_ble_client
      - logger.log: "BLE bond cleared - restart ESP and put radiator in pairing mode"

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# Text sensor for status. Not polled: refreshed when the link comes up or drops and
# whenever the mode changes (see set_state), so it only publishes on a real change.
text_sensor:
  - platform: template
    name: "Radiator Status"
    id: radiator_status
    icon: "mdi:information"
    update_interval: never
    lambda: |-
      if (!id(terma_hub).is_ready()) {
        return {"Disconnected"};
      }
      // Decoded from the b3 mode byte; the meaning depends on the protocol generation.
      return {id(terma_hub).mode_name(id(operating_mode))};
