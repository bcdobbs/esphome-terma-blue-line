# Terma MOA Blue on an M5Stack AtomS3 Lite (ESP32-S3, 8 MB flash, USB-C, own case).
# A complete device config: copy it into ESPHome Builder and add the secrets below.
#
# Exposes one "Radiator Power" switch that runs the element at element_temp (default
# 60 C, full power) or off, for a Home Assistant thermostat to drive. The ESP connects
# over Bluetooth only to send a command, then disconnects. See README.
#
# Secrets used (ESPHome Builder > Secrets):
#   terma_moa_blue__radiator_mac        the radiator's BLE MAC, e.g. "XX:XX:XX:XX:XX:XX"
#   terma_moa_blue__api_encryption_key  32-byte base64 key (also secures OTA)
#   wifi_ssid / wifi_password           2.4 GHz network

substitutions:
  device_name: terma-moa-blue
  radiator_mac: !secret terma_moa_blue__radiator_mac
  protocol: legacy        # delete if your radiator uses the modern protocol
  # Element temperature while on. The radiator's 5 button levels:
  #   "30" | "37.5" | "45" | "52.5" | "60" (full power, the default)
  # Any value from 30 to 60 works; values outside that range are clamped.
  element_temp: "60"

esphome:
  name: ${device_name}

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

logger:

api:
  encryption:
    key: !secret terma_moa_blue__api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/bcdobbs/esphome-terma-blue-line
      ref: main
    components: [terma_moa]
    refresh: 1d

packages:
  terma:
    url: https://github.com/bcdobbs/esphome-terma-blue-line
    ref: main
    files: [terma-on-demand.package.yaml]
    refresh: 1d

# ---------------------------------------------------------------------------
# Find your radiator's MAC
# ---------------------------------------------------------------------------
# 1. Put any placeholder in the radiator_mac secret (e.g. "00:00:00:00:00:00").
# 2. Uncomment the block below and install. The ESP scans for 5 minutes after boot.
# 3. Within that time, close the Terma app / turn off phone Bluetooth (the radiator
#    advertises only while nothing is connected), press the radiator's button to wake
#    it, and watch the logs for:
#      [find_terma] Found 'MOA Blue TERMA' MAC: XX:XX:XX:XX:XX:XX
# 4. Put that MAC in the secret, comment the block out again, put the radiator in
#    pairing mode (long-press until the BLE light flashes) and install.
