# Terma MOA Blue on an M5Stack AtomS3 Lite - ON-DEMAND variant.
#
# For when Home Assistant decides when to heat (e.g. a Generic Thermostat using its own
# room sensor): exposes one "Radiator Power" switch that runs the element at full power
# (60 C) or off. The ESP connects over Bluetooth only to send a command, then
# disconnects. See README "On-demand mode".
#
# While testing before the on-demand branch is merged, set both `ref:` lines below
# to `on-demand` (and `refresh: 0s` to pick up new pushes immediately).
#
# Secrets used (ESPHome Builder > Secrets):
#   terma_moa_blue__radiator_mac        the radiator's BLE MAC, e.g. "CC:22:37:10:DB:CE"
#   terma_moa_blue__api_encryption_key  32-byte base64 key (also secures OTA)
#   wifi_ssid / wifi_password           2.4 GHz network

substitutions:
  device_name: terma-moa-blue
  radiator_mac: !secret terma_moa_blue__radiator_mac
  protocol: legacy        # delete if your radiator uses the modern protocol
  # Element temperature while on. The radiator's 5 button levels:
  #   "30" | "37.5" | "45" | "52.5" | "60" (full power, the default)
  # Any value from 30 to 60 works; values outside that range are clamped.
  element_temp: "60"

esphome:
  name: ${device_name}

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

logger:

api:
  encryption:
    key: !secret terma_moa_blue__api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/bcdobbs/esphome-terma-blue-line
      ref: main
    components: [terma_moa]
    refresh: 1d

packages:
  terma:
    url: https://github.com/bcdobbs/esphome-terma-blue-line
    ref: main
    files: [terma-on-demand.package.yaml]
    refresh: 1d
