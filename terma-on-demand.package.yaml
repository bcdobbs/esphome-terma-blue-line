# terma-on-demand.package.yaml - on/off control of a Terma Blue Line element.
#
# For when Home Assistant (e.g. a Generic Thermostat with its own room sensor)
# decides when to heat. The ESP does NOT hold a Bluetooth connection: it connects
# only to switch the radiator, then lets go.
# That keeps the radiator free between commands (and quiet - some units whine while a
# phone or ESP is connected).
#
#   Every command: connect -> read the radiator's state. If it's already as asked,
#   disconnect - nothing is written. Otherwise:
#   Radiator Power ON  -> off -> element target (60 C) -> element mode
#   Radiator Power OFF -> off
#   then read back mode and target and check -> disconnect
#   If the target reads back above 60 C, it's switched off and checked until off.
#
# So a repeated command (e.g. a thermostat's keep_alive) is just a quick check, and
# only corrects the radiator if someone changed it at the radiator itself.
#
# A failed command gets up to 3 attempts straight away, then one a minute until it works
# (attempt numbers in the log keep counting across those retries).
# The switch shows what was asked for; Radiator Status shows what was confirmed.
# Changes made on the radiator's own buttons are not seen until the next command.
#
# Substitution contract (provided by the consuming device file):
#   radiator_mac  (required)  the radiator's BLE MAC (from secrets.yaml)
#   protocol      (optional)  "modern" (default) or "legacy" - see README "Protocol versions"
#   element_temp  (optional)  element target while on, 30-60 C (default 60 = full power).
#                             The radiator's 5 button levels are 30 / 37.5 / 45 / 52.5 / 60;
#                             other values are accepted, out-of-range ones clamped.
substitutions:
  protocol: modern
  element_temp: "60"

esp32_ble:
  io_capability: keyboard_only

# Needed by ble_client. Nothing here relies on scanning: connections are made
# directly to the MAC, so one scan at boot is enough.
esp32_ble_tracker:
  scan_parameters:
    continuous: false

ble_client:
  - mac_address: ${radiator_mac}
    id: terma_moa_ble_client
    auto_connect: false   # connect only when a command needs it
    on_passkey_request:
      then:
        - ble_client.passkey_reply:
            id: terma_moa_ble_client
            passkey: 123456

# Requests link encryption on connect (the radiator only talks over an encrypted,
# bonded link) and provides the protocol helpers used below.
terma_moa:
  id: terma_hub
  ble_client_id: terma_moa_ble_client
  protocol: ${protocol}

globals:
  - id: pending        # a command is still to be confirmed
    type: bool
    initial_value: "false"
  - id: fault          # safety cut-out fired; cleared by the next ON command
    type: bool
    initial_value: "false"
  - id: heat_now       # what the running command is doing (the cut-out turns ON into OFF)
    type: bool
    initial_value: "false"
  - id: target_c       # element target actually sent: clamped to 30-60 C, rounded to 0.1 C
    type: float
    initial_value: "60.0f"
  - id: needs_write    # the radiator isn't already as asked
    type: bool
    initial_value: "true"
  - id: attempt        # attempts in the current run of apply_power
    type: int
    initial_value: "0"
  - id: attempt_no     # attempts since the last switch command, for the log
    type: int
    initial_value: "0"
  - id: last_try_ms    # when the last attempt finished, so retries are a minute apart
    type: uint32_t
    initial_value: "0"
  - id: read_mode      # last mode byte read back, -1 = no fresh read
    type: int
    initial_value: "-1"
  - id: read_target    # last element target read back (C), NAN = no fresh read
    type: float
    initial_value: "NAN"

# The BLE stack's step-by-step debug lines are hidden. The terma lines (and the
# BLE client's info lines: connecting, open, auth, discovery, disconnect) tell the
# story of each command. Below DEBUG, a tag's startup config summary is hidden too.
# "esp-idf" is the Bluetooth controller's own chatter, which ESPHome logs at DEBUG
# whatever its real severity. To see everything again while debugging, override
# these in your device file, e.g.
#   logger:
#     logs:
#       esp32_ble_client: DEBUG
#       esp-idf: DEBUG
logger:
  logs:
    esp32_ble_client: INFO
    esp32_ble_tracker: INFO
    ble_client: INFO
    ble_client.automation: WARN
    esp-idf: INFO

script:
  # BLE writes live in their own scripts, which apply_power runs with script.wait.
  # If the link drops mid-write, ESPHome abandons the rest of the write's action
  # chain without telling the enclosing if/while, so a write inline in apply_power
  # would leave it stuck "running". Here only the helper ends, and apply_power
  # carries on (and retries). Queued so a write is never skipped.
  #
  # Write a mode byte to b3.
  - id: write_mode
    mode: queued
    parameters:
      m: int
    then:
      - ble_client.ble_write:
          id: terma_moa_ble_client
          service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
          characteristic_uuid: "d97352b3-d19e-11e2-9e96-0800200c9a66"
          value: !lambda "return id(terma_hub).encode_mode(m);"

  # Write the element target (C) to b2.
  - id: write_target
    mode: queued
    parameters:
      t: float
    then:
      - ble_client.ble_write:
          id: terma_moa_ble_client
          service_uuid: "d97352b0-d19e-11e2-9e96-0800200c9a66"
          characteristic_uuid: "d97352b2-d19e-11e2-9e96-0800200c9a66"
          value: !lambda "return id(terma_hub).encode_element_target(t);"

  # Read the mode (b3) and element target (b2) into read_mode / read_target.
  # read_mode stays -1 if the radiator doesn't answer within 5 s.
  - id: read_back
    then:
      - lambda: "id(terma_hub).request_read();"
      - wait_until:
          condition:
            lambda: "return !id(terma_hub).is_reading();"
          timeout: 5s
      - lambda: |-
          id(read_mode) = id(terma_hub).read_mode();
          id(read_target) = id(terma_hub).read_target();

  # Connect, set the radiator on or off, check it took, disconnect, making up to
  # `tries` attempts. mode: restart - a newer command replaces one still in progress
  # (and reuses its connection).
  - id: apply_power
    mode: restart
    parameters:
      heat: bool
      tries: int
    then:
      - lambda: |-
          id(heat_now) = heat;
          id(pending) = true;
          id(attempt) = 0;
          // A new ON clears a previous cut-out; an OFF keeps it showing.
          if (heat) id(fault) = false;
          float c = std::min(60.0f, std::max(30.0f, (float) ${element_temp}));
          id(target_c) = std::round(c * 10.0f) / 10.0f;
      - text_sensor.template.publish:
          id: radiator_status
          state: !lambda |-
            if (id(fault)) return "Fault - target out of range, switching off";
            return heat ? "Switching on" : "Switching off";
      # Right after boot the BLE stack is still registering; connecting before then
      # is refused, so wait for it rather than burning an attempt.
      - wait_until:
          condition:
            lambda: "return id(terma_moa_ble_client).get_gattc_if() != ESP_GATT_IF_NONE;"
          timeout: 30s
      - while:
          condition:
            lambda: "return id(pending) && id(attempt) < tries;"
          then:
            - lambda: |-
                id(attempt) += 1;
                id(attempt_no) += 1;
                ESP_LOGI("terma", "Turning radiator %s (attempt %d)", id(heat_now) ? "ON" : "OFF", id(attempt_no));
                id(terma_moa_ble_client).connect();
            # Stop waiting as soon as the connection fails (the client drops back to
            # IDLE). 30 s because a weak link can take ~20 s to get through encryption
            # and service discovery - typically when switching off, with the element
            # heating.
            - wait_until:
                condition:
                  lambda: |-
                    return id(terma_hub).is_ready() ||
                           id(terma_moa_ble_client).state() == esp32_ble_tracker::ClientState::IDLE;
                timeout: 30s
            - if:
                condition:
                  lambda: "return id(terma_hub).is_ready();"
                then:
                  # Check first: if it's already as asked, there's nothing to write.
                  - script.execute: read_back
                  - script.wait: read_back
                  - lambda: |-
                      int m = id(read_mode);
                      float t = id(read_target);
                      bool on = id(heat_now);
                      bool as_asked = m >= 0 &&
                          (on ? id(terma_hub).is_element_mode(m) && fabsf(t - id(target_c)) < 0.05f
                              : !id(terma_hub).is_heating(m));
                      id(needs_write) = !as_asked;
                      if (as_asked) {
                        id(pending) = false;
                        ESP_LOGI("terma", "Already %s (mode 0x%02X, target %.1f C) - nothing to change",
                                 on ? "ON" : "OFF", m, t);
                      } else if (m >= 0) {
                        ESP_LOGI("terma", "Radiator is in mode 0x%02X (target %.1f C) - changing it", m, t);
                      }
                  - if:
                      condition:
                        lambda: "return id(needs_write);"
                      then:
                        # Always via off first: legacy units can double the target if
                        # the mode is changed directly (see README "Protocol versions").
                        - script.execute: { id: write_mode, m: 0 }
                        - script.wait: write_mode
                        - if:
                            condition:
                              lambda: "return id(heat_now);"
                            then:
                              - delay: 500ms
                              - script.execute:
                                  id: write_target
                                  t: !lambda "return id(target_c);"
                              - script.wait: write_target
                              - delay: 500ms
                              - script.execute:
                                  id: write_mode
                                  m: !lambda "return id(terma_hub).mode_element();"
                              - script.wait: write_mode
                        # Read back what the radiator now reports.
                        - delay: 1s
                        - script.execute: read_back
                        - script.wait: read_back
                        - lambda: |-
                            int m = id(read_mode);
                            float t = id(read_target);
                            bool on = id(heat_now);
                            bool target_ok = !std::isnan(t) && fabsf(t - id(target_c)) < 0.05f;
                            if (m < 0) {
                              ESP_LOGW("terma", "No read-back from the radiator");
                            } else if (on && t > 60.05f) {
                              // Safety net: never leave it heating with an out-of-range target.
                              // Write off now, then carry on as an OFF command (with a fresh
                              // set of attempts) until a read-back confirms it's off.
                              ESP_LOGE("terma", "Element target read back as %.1f C - switching off", t);
                              id(write_mode).execute(0);
                              id(fault) = true;
                              id(heat_now) = false;
                              id(attempt) = 0;
                              id(power_switch).publish_state(false);  // show it's off
                            } else if (on ? id(terma_hub).is_element_mode(m) && target_ok
                                          : !id(terma_hub).is_heating(m)) {
                              id(pending) = false;
                              ESP_LOGI("terma", "Confirmed %s (mode 0x%02X, target %.1f C)", on ? "ON" : "OFF", m, t);
                            } else if (on && id(terma_hub).is_element_mode(m)) {
                              ESP_LOGW("terma", "Element target read back as %.1f C, expected %.1f C", t, id(target_c));
                            } else {
                              ESP_LOGW("terma", "Radiator reports mode 0x%02X - not what was asked", m);
                            }
                        - script.wait: write_mode
                else:
                  - lambda: |-
                      ESP_LOGW("terma", "Could not connect to the radiator (attempt %d)", id(attempt_no));
            - lambda: |-
                if (id(terma_moa_ble_client).state() != esp32_ble_tracker::ClientState::IDLE)
                  id(terma_moa_ble_client).disconnect();
            - wait_until:   # fully closed, so the next connect isn't refused
                condition:
                  lambda: "return id(terma_moa_ble_client).state() == esp32_ble_tracker::ClientState::IDLE;"
                timeout: 5s
            - lambda: "id(last_try_ms) = millis();"
            - if:
                condition:
                  lambda: "return id(pending) && id(attempt) < tries;"
                then:
                  - delay: 5s
      - text_sensor.template.publish:
          id: radiator_status
          state: !lambda |-
            if (id(fault))
              return id(pending) ? "Fault - target out of range, switching off"
                                 : "Fault - target out of range, switched off";
            if (id(pending)) return id(heat_now) ? "Retrying on" : "Retrying off";
            return id(heat_now) ? "On" : "Off";

# Keep retrying an unconfirmed command, one attempt a minute after the last one.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(pending) && !id(apply_power).is_running() &&
                     millis() - id(last_try_ms) >= 60000;
          then:
            - script.execute:
                id: apply_power
                heat: !lambda "return id(power_switch).state;"
                tries: 1

switch:
  - platform: template
    name: "Radiator Power"
    id: power_switch
    icon: "mdi:radiator"
    optimistic: true
    # On boot, make sure the radiator is off; a thermostat will turn it back on if needed.
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: "id(attempt_no) = 0;"
      - script.execute: { id: apply_power, heat: true, tries: 3 }
    turn_off_action:
      - lambda: "id(attempt_no) = 0;"
      - script.execute: { id: apply_power, heat: false, tries: 3 }

text_sensor:
  - platform: template
    name: "Radiator Status"
    id: radiator_status
    icon: "mdi:information"
    update_interval: never

button:
  - platform: template
    name: "Clear BLE Bonds"
    icon: "mdi:bluetooth-off"
    entity_category: diagnostic
    on_press:
      - ble_client.remove_bond:
          id: terma_moa_ble_client
      - logger.log: "BLE bond cleared - put the radiator in pairing mode and switch it on/off to re-pair"

  - platform: restart
    name: "Restart"
    entity_category: diagnostic
